name: Deploy HTML report to GitHub Pages

# Запускается при каждом пуше в main (обновление файлов),
# а также вручную из вкладки Actions.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Права, необходимые для публикации на Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Отменяем предыдущий запущенный деплой, если пришёл новый пуш
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Публикуем из корня репозитория.
          # Для варианта /docs заменить на: path: "docs"
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
